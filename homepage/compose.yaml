include:
  - ../compose-snippets/network-for-nginx-proxy.yaml

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1
    container_name: homepage

    # ports:
    #   - 3000:3000
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.lab,home.giusepperota.com

    volumes:
      - ./config:/app/config
      - ./assets:/app/public/custom_assets
      - /var/run/docker.sock:/var/run/docker.sock

    labels:
      - diun.enable=true

    restart: unless-stopped
    extends:
      file: ../compose-snippets/logging-limits.yaml
      service: logging
